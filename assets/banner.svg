<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#10233f"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1400" height="420" rx="30" fill="url(#bg)"/>
  <circle cx="1150" cy="70" r="220" fill="#06b6d4" opacity="0.10"/>
  <circle cx="1270" cy="330" r="170" fill="#22c55e" opacity="0.10"/>

  <g filter="url(#shadow)">
    <rect x="60" y="60" width="790" height="300" rx="28" fill="#0f172a" opacity="0.78" stroke="#334155"/>
    <text x="100" y="120" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">ACADEMIC RESEARCH PROTOTYPE</text>
    <text x="100" y="178" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800">Adaptive AI Cyber Risk</text>
    <text x="100" y="228" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800">Training Lab</text>
    <text x="100" y="282" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="21">Assistive AI scenarios for defensive cyber risk assessment,</text>
    <text x="100" y="313" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="21">quality assurance, learner adaptation, and cyber range training.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="910" y="70" width="410" height="280" rx="26" fill="#f8fafc"/>
    <rect x="945" y="110" width="130" height="70" rx="18" fill="#dbeafe" stroke="#2563eb"/>
    <text x="1010" y="153" text-anchor="middle" fill="#1e3a8a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Learner</text>
    <rect x="1155" y="110" width="130" height="70" rx="18" fill="#ecfeff" stroke="#0891b2"/>
    <text x="1220" y="153" text-anchor="middle" fill="#155e75" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">AI Assist</text>
    <path d="M1085 145 H1140" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="945" y="230" width="340" height="70" rx="18" fill="#ecfdf5" stroke="#10b981"/>
    <text x="1115" y="258" text-anchor="middle" fill="#065f46" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Quality-Assured Scenario</text>
    <text x="1115" y="284" text-anchor="middle" fill="#0f766e" font-family="Arial, Helvetica, sans-serif" font-size="15">risk assessment · controls · residual risk</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
